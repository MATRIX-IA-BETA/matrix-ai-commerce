<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matrix AI - Central SAC</title>
<style>
:root{--bg:#07101d;--panel:#0d1728;--line:#22314b;--txt:#eef4ff;--muted:#90a0b8;--in:#17243a;--out:#2b347a;--acc:#6d5dfc}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}
body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0b1423}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acc);font-weight:800}
.title{font-weight:800}.status{margin-left:auto;color:#8ee8d7;font-size:12px}.layout{display:grid;grid-template-columns:350px 1fr;min-height:0}
.side{min-height:0;border-right:1px solid var(--line);background:#091220;display:grid;grid-template-rows:auto 1fr}
.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}
input,select,button{background:#111d31;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px}
.filters input{flex:1;min-width:0}.list{overflow:auto}.conv{padding:12px;border-bottom:1px solid #17243a;cursor:pointer}
.conv.active{background:#16213a;border-left:3px solid var(--acc)}.name{font-weight:700}.preview,.time{color:var(--muted);font-size:12px}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-height:0;display:grid;grid-template-rows:auto 1fr;background:#07101d}.head{padding:11px 12px;border-bottom:1px solid var(--line);background:#0b1423;display:flex;align-items:center;gap:8px}
.back{display:none}.who{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--muted)}
.msgs{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 11px;border-radius:13px;line-height:1.35;font-size:14px}
.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}.meta{font-size:10px;color:#a9b5c8;margin-top:5px}
.analysis{margin-top:7px;padding:7px;border-left:2px solid #7784a3;background:rgba(0,0,0,.15);font-size:12px;color:#d0d8e6}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#0b1423}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:120px;background:#111d31;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}
.send{background:var(--acc);font-weight:700;min-width:78px}.send:disabled{opacity:.45}
.main{grid-template-rows:auto 1fr auto}
@media(max-width:760px){
.layout{display:block}.side,.main{position:absolute;top:58px;bottom:0;left:0;right:0}.main{transform:translateX(100%);transition:.18s;z-index:5}.side{z-index:4;border-right:0}
body.open .main{transform:translateX(0)}body.open .side{visibility:hidden}.back{display:inline-block}.bubble{max-width:89%}
}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">M</div><div class="title">Matrix AI - Central SAC</div><div class="status">● ao vivo</div></header>
<div class="layout">
<section class="side">
<div class="filters"><input id="q" placeholder="Buscar cliente..."><select id="f"><option value="">Todos</option><option value="review">Revisão</option><option value="urgent">Urgente</option></select></div>
<div class="list" id="list"><div class="empty">Carregando atendimentos...</div></div>
</section>
<section class="main">
<div class="head"><button class="back" id="back">‹</button><div class="who"><b id="who">Selecione uma conversa</b><small id="meta">Acompanhamento em tempo real</small></div></div>
<div class="msgs" id="msgs"><div class="empty">Escolha uma conversa para acompanhar o que o cliente enviou e o que a IA respondeu.</div></div>
<div class="composer">
  <textarea id="reply" placeholder="Digite sua resposta..." disabled></textarea>
  <button class="send" id="send" disabled>Enviar</button>
</div>
</section>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const S={rows:[],id:null,conversation:null,listSig:"",convSig:"",busy:false,sending:false};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>{if(!v)return"";const d=new Date(v);return isNaN(d)? "":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
const name=c=>c.contact_name||c.buyer_nickname||c.external_user_id||c.phone_number||"Cliente";
const prev=c=>c.last_message_text||c.last_message||c.summary||c.last_response_text||"Sem prévia";
const sig=v=>{try{return JSON.stringify(v)}catch{return String(Date.now())}};
async function get(url){const r=await fetch(url,{cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok||d.sucesso===false)throw new Error(d.mensagem||("HTTP "+r.status));return d}
async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok||d.sucesso===false)throw new Error(d.mensagem||("HTTP "+r.status));return d}
function renderList(){
 const q=$("q").value.toLowerCase().trim(),f=$("f").value,box=$("list"),old=box.scrollTop;
 const rows=S.rows.filter(c=>{const h=(name(c)+" "+prev(c)+" "+(c.external_user_id||"")).toLowerCase();if(q&&!h.includes(q))return false;if(f==="review"&&c.requires_review!==true)return false;if(f==="urgent"&&c.attention_level!=="urgent")return false;return true});
 box.innerHTML=rows.length?rows.map(c=>`<div class="conv ${String(c.id)===String(S.id)?"active":""}" data-id="${esc(c.id)}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="name">${esc(name(c))}</span><span class="time">${esc(fmt(c.last_message_at))}</span></div><div class="preview">${esc(prev(c))}</div></div>`).join(""):'<div class="empty">Nenhuma conversa encontrada.</div>';
 box.scrollTop=old;document.querySelectorAll(".conv").forEach(el=>el.onclick=()=>openConv(el.dataset.id,true));
}
async function loadList(force=false){
 const d=await get("/sac/central/live?limit=300");const rows=d.conversas||[];const s=sig(rows.map(c=>[c.id,c.last_message_at,prev(c),c.requires_review,c.attention_level,c.control_mode]));S.rows=rows;if(force||s!==S.listSig){S.listSig=s;renderList()}
}
async function openConv(id,manual=false){
 if(manual){S.id=id;S.convSig="";document.body.classList.add("open");renderList();$("msgs").innerHTML='<div class="empty">Carregando conversa...</div>'}
 const d=await get("/sac/central/conversation/"+encodeURIComponent(id)+"?limit=500");const m=d.mensagens||[];const c0=d.conversa||{};S.conversation=c0;const to=String(c0.external_user_id||c0.phone_number||"").replace(/\D/g,"");const canSend=String(c0.channel||"").toLowerCase()==="whatsapp"&&Boolean(to);$("reply").disabled=!canSend;$("send").disabled=!canSend;$("reply").placeholder=canSend?"Digite sua resposta...":"Conversa sem número de WhatsApp válido.";const s=sig([d.conversa?.last_message_at,m.map(x=>[x.id,x.created_at,x.date_created,x.text,x.content,x.metadata])]);if(!manual&&s===S.convSig)return;S.convSig=s;
 const c=d.conversa||{};$("who").textContent=name(c);$("meta").textContent=(c.channel||"canal")+" • "+(c.external_user_id||"")+" • "+(c.control_mode||"ai");
 const box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120,old=box.scrollTop;
 box.innerHTML=m.length?m.map(x=>{const out=x.direction==="outbound"||x.role==="assistant"||x.sender_role==="assistant";const a=x.transcription||x.image_analysis||x.video_analysis;return `<div class="bubble ${out?"out":"in"}"><div>${esc(x.text||x.content||"(mídia)")}</div>${a?`<div class="analysis">${esc(typeof a==="string"?a:JSON.stringify(a))}</div>`:""}<div class="meta">${out?"Matrix AI":"Cliente"} • ${esc(fmt(x.date_created||x.created_at))}</div></div>`}).join(""):'<div class="empty">Nenhuma mensagem registrada.</div>';
 if(manual||near)box.scrollTop=box.scrollHeight;else box.scrollTop=old;
}
async function refresh(force=false){
 if(S.busy)return;S.busy=true;try{await loadList(force);if(S.id)await openConv(S.id,false)}catch(e){console.error(e)}finally{S.busy=false}
}

async function sendReply(){
 if(S.sending)return;

 const text=$("reply").value.trim();
 const c=S.conversation||{};
 const to=String(c.external_user_id||c.phone_number||"").replace(/\D/g,"");

 if(!text||!S.id||!to)return;

 S.sending=true;
 $("send").disabled=true;
 $("send").textContent="Enviando...";

 try{
   await post("/whatsapp/send",{
     to,
     message:text,
     conversation_id:S.id
   });

   $("reply").value="";
   S.convSig="";

   await openConv(S.id,false);
   await loadList(true);

 }catch(e){
   alert("Erro ao enviar: "+e.message);

 }finally{
   S.sending=false;
   $("send").textContent="Enviar";

   const currentTo=String(
     S.conversation?.external_user_id||
     S.conversation?.phone_number||
     ""
   ).replace(/\D/g,"");

   $("send").disabled=!currentTo;
 }
}
$("send").onclick=sendReply;
$("reply").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
   e.preventDefault();
   sendReply();
 }
});
$("q").oninput=renderList;$("f").onchange=renderList;$("back").onclick=()=>document.body.classList.remove("open");
refresh(true);
setInterval(()=>refresh(false),8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh(false)});
})();
</script>
</body>
</html>
