<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matrix AI - SAC ML</title>
<link rel="stylesheet" href="/matrix-global-nav.css?v=4">
<script defer src="/matrix-global-nav.js?v=4"></script>
<style>
:root{--bg:#07101d;--panel:#0d1728;--line:#22314b;--txt:#eef4ff;--muted:#90a0b8;--in:#17243a;--out:#2b347a;--acc:#2f80ed;--warn:#ffd27a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0b1423}.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acc);font-weight:800}.title{font-weight:800}.status{margin-left:auto;color:#8ee8d7;font-size:12px}.status.warn{color:var(--warn)}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:0}.side{min-height:0;border-right:1px solid var(--line);background:#091220;display:grid;grid-template-rows:auto 1fr}.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}input,button{background:#111d31;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px}.filters input{flex:1;min-width:0}.list{overflow:auto}.conv{padding:12px;border-bottom:1px solid #17243a;cursor:pointer}.conv:hover{background:#101d31}.conv.active{background:#16213a;border-left:3px solid var(--acc)}.name{font-weight:700}.preview,.time,.order,.product{color:var(--muted);font-size:12px}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.order,.product{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-height:0;display:grid;grid-template-rows:auto 1fr auto;background:#07101d}.head{padding:11px 12px;border-bottom:1px solid var(--line);background:#0b1423;display:flex;align-items:center;gap:8px}.back{display:none}.who{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--muted)}.msgs{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 11px;border-radius:13px;line-height:1.35;font-size:14px}.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}.meta{font-size:10px;color:#a9b5c8;margin-top:5px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#0b1423}.composer textarea{flex:1;resize:none;min-height:42px;max-height:120px;background:#111d31;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.send{background:var(--acc);font-weight:700;min-width:78px}.send:disabled{opacity:.45}.error{padding:8px 10px;color:#ffb3bf;background:#3b1822;border-bottom:1px solid #6e2838;font-size:12px;display:none}.error.show{display:block}
@media(max-width:760px){.app{grid-template-rows:52px 1fr}header{gap:7px;padding:8px}.logo{width:34px;height:34px}.title{font-size:14px;white-space:nowrap}.status{font-size:11px;white-space:nowrap}.layout{display:block}.side,.main{position:absolute;top:52px;bottom:0;left:0;right:0}.main{visibility:hidden;opacity:0;transition:opacity .18s;z-index:5}.side{z-index:4;border-right:0}body.open .main{visibility:visible;opacity:1}body.open .side{visibility:hidden}.back{display:inline-block}.bubble{max-width:89%}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">ML</div><div class="title">Matrix AI - SAC ML</div><div class="status" id="syncStatus">● conectando ao Mercado Livre</div></header>
<div class="error" id="error"></div>
<div class="layout">
<section class="side"><div class="filters"><input id="q" placeholder="Buscar cliente, pedido ou mensagem..."></div><div class="list" id="list"><div class="empty">Carregando mensagens pós-venda direto do Mercado Livre...</div></div></section>
<section class="main"><div class="head"><button class="back" id="back">‹</button><div class="who"><b id="who">Selecione uma conversa</b><small id="meta">Mensagens pós-compra do Mercado Livre</small></div></div><div class="msgs" id="msgs"><div class="empty">As conversas aparecerão aqui conforme forem encontradas.</div></div><div class="composer"><textarea id="reply" placeholder="Digite sua resposta..." disabled maxlength="350"></textarea><button class="send" id="send" disabled>Enviar</button></div></section>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const S={map:new Map(),rows:[],selected:null,current:null,scanning:false,sending:false,initialized:false};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>{if(!v)return"";const d=new Date(v);return isNaN(d)?"":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
async function json(url,opt){const r=await fetch(url,{cache:"no-store",...(opt||{})});const d=await r.json().catch(()=>({}));if(!r.ok||d.sucesso===false)throw new Error(d.mensagem||`HTTP ${r.status}`);return d}
function status(text,warn=false){const e=$("syncStatus");e.textContent=text;e.classList.toggle("warn",warn)}
function showError(text=""){const e=$("error");e.textContent=text;e.classList.toggle("show",Boolean(text))}
function rebuild(){S.rows=[...S.map.values()].sort((a,b)=>new Date(b.last_message_at||0)-new Date(a.last_message_at||0))}
function merge(rows){for(const c of rows||[])if(c?.pack_id)S.map.set(String(c.pack_id),c);rebuild()}
function name(c){return c.buyer_name||c.buyer_nickname||c.buyer_id||`Pedido ${c.order_id||"ML"}`}
function renderList(){const term=$("q").value.toLowerCase().trim();const rows=S.rows.filter(c=>!term||`${name(c)} ${c.order_id||""} ${c.last_message_text||""} ${c.product_title||""}`.toLowerCase().includes(term));const box=$("list"),old=box.scrollTop;box.innerHTML=rows.length?rows.map(c=>`<div class="conv ${String(c.pack_id)===String(S.selected)?"active":""}" data-pack="${esc(c.pack_id)}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="name">${esc(name(c))}</span><span class="time">${esc(fmt(c.last_message_at))}</span></div><div class="preview">${esc(c.last_message_text||"Mensagem pós-venda")}</div><div class="order">Pedido: ${esc(c.order_id||"não identificado")}</div><div class="product">${esc(c.product_title||"")}</div></div>`).join(""):'<div class="empty">Ainda não encontrei conversas pós-venda nos pedidos varridos.</div>';box.scrollTop=old;document.querySelectorAll(".conv").forEach(el=>el.onclick=()=>openConversation(el.dataset.pack,true))}
function renderConversation(c){S.current=c||null;if(!c){$("who").textContent="Selecione uma conversa";$("meta").textContent="Mensagens pós-compra do Mercado Livre";$("msgs").innerHTML='<div class="empty">Selecione uma conversa.</div>';$("reply").disabled=true;$("send").disabled=true;return}$("who").textContent=name(c);$("meta").textContent=`Mercado Livre • pedido ${c.order_id||"não identificado"} • ${c.product_title||"produto"}`;const m=Array.isArray(c.messages)?c.messages:[];$("msgs").innerHTML=m.length?m.map(x=>`<div class="bubble ${x.direction==="outbound"?"out":"in"}"><div>${esc(x.text||"(mídia)")}</div><div class="meta">${x.direction==="outbound"?"Shop Matrix":"Cliente"} • ${esc(fmt(x.date_created))}</div></div>`).join(""):'<div class="empty">Nenhuma mensagem retornada pelo Mercado Livre.</div>';$("msgs").scrollTop=$("msgs").scrollHeight;$("reply").disabled=false;$("send").disabled=false}
async function openConversation(pack,manual=false){S.selected=String(pack);if(manual)document.body.classList.add("open");renderList();const cached=S.map.get(S.selected);if(cached)renderConversation(cached);try{const d=await json(`/api/sac/ml/live/${encodeURIComponent(S.selected)}`);S.map.set(S.selected,d.conversa);rebuild();renderList();renderConversation(d.conversa);showError("")}catch(e){showError(`Erro abrindo conversa: ${e.message}`)}}
async function scan(reset=false){if(S.scanning)return;S.scanning=true;showError("");try{if(reset){S.map.clear();S.rows=[];renderList()}let offset=0,scanned=0,total=null,errors=0;const max=1000;while(offset<max){status(`● buscando histórico ${scanned+1}–${Math.min(scanned+60,max)}`);const d=await json(`/api/sac/ml/live?offset=${offset}&batch=60${reset&&offset===0?'&refresh=1':''}`);merge(d.conversas||[]);renderList();scanned+=Number(d.pedidos_lidos||0);total=d.pedidos_total;errors+=Number(d.erros||0);if(!S.selected&&S.rows.length){S.selected=String(S.rows[0].pack_id);renderList();renderConversation(S.rows[0])}status(`● ${S.rows.length} conversas · ${scanned}${total?`/${total}`:""} pedidos${errors?` · ${errors} erro(s)`:""}`,errors>0);if(!d.has_more||!d.pedidos_lidos||scanned>=max)break;offset=Number(d.next_offset||offset+60)}S.initialized=true;status(`● ${S.rows.length} conversas ao vivo${total&&scanned<total?` · ${scanned}/${total} pedidos varridos`:""}`,errors>0)}catch(e){showError(e.message);status("● falha ao carregar SAC ML",true)}finally{S.scanning=false}}
async function refreshRecent(){if(S.scanning||S.sending||document.hidden)return;try{const d=await json('/api/sac/ml/live?offset=0&batch=80&refresh=1');merge(d.conversas||[]);renderList();if(S.selected&&S.map.has(S.selected))renderConversation(S.map.get(S.selected));status(`● ${S.rows.length} conversas ao vivo`,Number(d.erros||0)>0)}catch(e){console.warn(e)}}
async function send(){if(S.sending||!S.selected)return;const text=$("reply").value.trim();if(!text)return;S.sending=true;$("send").disabled=true;$("send").textContent="Enviando...";showError("");try{const d=await json(`/api/sac/ml/live/${encodeURIComponent(S.selected)}/send`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});$("reply").value="";if(d.conversa){S.map.set(S.selected,d.conversa);rebuild();renderList();renderConversation(d.conversa)}else await openConversation(S.selected,false)}catch(e){showError(`Erro ao enviar: ${e.message}`)}finally{S.sending=false;$("send").textContent="Enviar";$("send").disabled=!S.current}}
$("q").oninput=renderList;$("back").onclick=()=>document.body.classList.remove("open");$("send").onclick=send;$("reply").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
scan(true);setInterval(refreshRecent,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshRecent()});
})();
</script>
</body>
</html>
