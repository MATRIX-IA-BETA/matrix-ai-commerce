<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matrix AI - SAC ML</title>
<link rel="stylesheet" href="/matrix-global-nav.css?v=2">
<script defer src="/matrix-global-nav.js?v=2"></script>
<style>
:root{--bg:#07101d;--panel:#0d1728;--line:#22314b;--txt:#eef4ff;--muted:#90a0b8;--in:#17243a;--out:#2b347a;--acc:#2f80ed}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}body{overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0b1423}.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acc);font-weight:800}.title{font-weight:800}.status{margin-left:auto;color:#8ee8d7;font-size:12px}.layout{display:grid;grid-template-columns:380px 1fr;min-height:0}.side{min-height:0;border-right:1px solid var(--line);background:#091220;display:grid;grid-template-rows:auto 1fr}.filters{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px}input,button{background:#111d31;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px}.filters input{flex:1;min-width:0}.list{overflow:auto}.conv{padding:12px;border-bottom:1px solid #17243a;cursor:pointer}.conv.active{background:#16213a;border-left:3px solid var(--acc)}.name{font-weight:700}.preview,.time,.order{color:var(--muted);font-size:12px}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.order{margin-top:4px}.main{min-height:0;display:grid;grid-template-rows:auto 1fr auto;background:#07101d}.head{padding:11px 12px;border-bottom:1px solid var(--line);background:#0b1423;display:flex;align-items:center;gap:8px}.back{display:none}.who{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--muted)}.msgs{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 11px;border-radius:13px;line-height:1.35;font-size:14px}.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:4px}.out{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}.meta{font-size:10px;color:#a9b5c8;margin-top:5px}.empty{height:100%;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#0b1423}.composer textarea{flex:1;resize:none;min-height:42px;max-height:120px;background:#111d31;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.send{background:var(--acc);font-weight:700;min-width:78px}.send:disabled{opacity:.45}
@media(max-width:760px){.app{grid-template-rows:52px 1fr}header{gap:7px;padding:8px}.logo{width:34px;height:34px}.title{font-size:14px;white-space:nowrap}.status{font-size:11px;white-space:nowrap}.layout{display:block}.side,.main{position:absolute;top:52px;bottom:0;left:0;right:0}.main{visibility:hidden;opacity:0;transition:opacity .18s;z-index:5}.side{z-index:4;border-right:0}body.open .main{visibility:visible;opacity:1}body.open .side{visibility:hidden}.back{display:inline-block}.bubble{max-width:89%}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">ML</div><div class="title">Matrix AI - SAC ML</div><div class="status" id="syncStatus">● pós-venda</div></header>
<div class="layout">
<section class="side"><div class="filters"><input id="q" placeholder="Buscar cliente, pedido ou mensagem..."></div><div class="list" id="list"><div class="empty">Carregando mensagens pós-venda...</div></div></section>
<section class="main"><div class="head"><button class="back" id="back">‹</button><div class="who"><b id="who">Selecione uma conversa</b><small id="meta">Mensagens pós-compra do Mercado Livre</small></div></div><div class="msgs" id="msgs"><div class="empty">Escolha uma conversa para acompanhar o pós-venda do Mercado Livre.</div></div><div class="composer"><textarea id="reply" placeholder="Digite sua resposta..." disabled></textarea><button class="send" id="send" disabled>Enviar</button></div></section>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);const S={rows:[],id:null,thread:null,sending:false,syncing:false};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>{if(!v)return"";const d=new Date(v);return isNaN(d)?"":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
const name=t=>t.buyer_nickname||t.buyer_id||`Pedido ${t.order_id||"ML"}`;
const rawMsgs=t=>Array.isArray(t?.raw_data?.messages)?t.raw_data.messages:[];
const msgText=m=>String(m?.text?.plain??m?.text??m?.message??"").trim();
const hasMessages=t=>rawMsgs(t).length>0||Boolean(t.last_response_text)||Boolean(t.subject);
const preview=t=>{const m=rawMsgs(t),last=m.length?msgText(m[m.length-1]):"";return last||t.last_response_text||t.subject||t.ai_draft||"Mensagem pós-venda"};
async function json(url,opt){const r=await fetch(url,{cache:"no-store",...(opt||{})});const d=await r.json().catch(()=>({}));if(!r.ok||d.sucesso===false)throw new Error(d.mensagem||`HTTP ${r.status}`);return d}
function renderList(){const q=$("q").value.toLowerCase().trim();const rows=S.rows.filter(t=>!q||`${name(t)} ${t.order_id||""} ${preview(t)}`.toLowerCase().includes(q));$("list").innerHTML=rows.length?rows.map(t=>`<div class="conv ${String(t.id)===String(S.id)?"active":""}" data-id="${esc(t.id)}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="name">${esc(name(t))}</span><span class="time">${esc(fmt(t.last_message_at))}</span></div><div class="preview">${esc(preview(t))}</div><div class="order">Pedido: ${esc(t.order_id||"não identificado")}</div></div>`).join(""):'<div class="empty">Nenhuma mensagem pós-venda encontrada.</div>';document.querySelectorAll(".conv").forEach(el=>el.onclick=()=>openThread(el.dataset.id))}
async function load(){const d=await json("/sac?limit=500&type=message");S.rows=(d.atendimentos||[]).filter(t=>String(t.channel||"").toLowerCase()==="mercadolivre"&&hasMessages(t));renderList()}
async function sync(){if(S.syncing||S.sending)return;S.syncing=true;$("syncStatus").textContent="● sincronizando";try{try{await json("/sac/sync/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})}catch(e){console.warn("[SAC ML] sync não lidas:",e)}try{await json("/sac/ml/history/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({limit:500,batch:60})})}catch(e){console.warn("[SAC ML] sync histórico:",e)}await load();if(S.id)await openThread(S.id,false)}finally{S.syncing=false;$("syncStatus").textContent="● pós-venda"}}
async function openThread(id,manual=true){S.id=id;if(manual)document.body.classList.add("open");renderList();if(manual)$("msgs").innerHTML='<div class="empty">Carregando conversa...</div>';const d=await json(`/sac/${encodeURIComponent(id)}`);S.thread=d.thread||{};const m=d.messages||[];$("who").textContent=name(S.thread);$("meta").textContent=`Mercado Livre • pedido ${S.thread.order_id||"não identificado"}`;$("msgs").innerHTML=m.length?m.map(x=>`<div class="bubble ${x.direction==="outbound"?"out":"in"}"><div>${esc(x.text||"(mídia)")}</div><div class="meta">${x.direction==="outbound"?"Shop Matrix":"Cliente"} • ${esc(fmt(x.date_created||x.created_at))}</div></div>`).join(""):'<div class="empty">Nenhuma mensagem registrada.</div>';$("msgs").scrollTop=$("msgs").scrollHeight;$("reply").disabled=false;$("send").disabled=false;$("reply").placeholder="Digite sua resposta..."}
async function send(){if(S.sending)return;const text=$("reply").value.trim();if(!S.id||!text)return;S.sending=true;$("send").disabled=true;$("send").textContent="Enviando...";try{await json(`/sac/${encodeURIComponent(S.id)}/send`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});$("reply").value="";await load();await openThread(S.id,false)}catch(e){alert("Erro ao enviar: "+e.message)}finally{S.sending=false;$("send").textContent="Enviar";$("send").disabled=false}}
$("send").onclick=send;$("reply").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("q").oninput=renderList;$("back").onclick=()=>document.body.classList.remove("open");
load().catch(console.error).finally(()=>sync());
setInterval(()=>{if(!document.hidden&&!S.sending)sync()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
})();
</script>
</body>
</html>
