<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix AI | Central de Reclamações</title>
<style>
:root{--bg:#07101f;--panel:#0c1729;--panel2:#101d33;--line:#223b5e;--line2:#31547d;--text:#eef5ff;--muted:#91a8c7;--blue:#2784ff;--blue2:#135fcb;--red:#ff5d72;--redbg:#421a29;--yellow:#f7bf27;--yellowbg:#3b3014;--green:#29df91;--greenbg:#123a2b;--purple:#6757f4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#07101f,#081425 58%,#07101d);color:var(--text)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.page{min-height:calc(100dvh - var(--matrix-nav-h,72px));padding:14px 20px 18px;display:flex;flex-direction:column;gap:12px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:14px}.title-left{display:flex;align-items:center;gap:12px}.title-icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#6f5bff,#4d39df);font-size:21px;font-weight:900;box-shadow:0 0 28px rgba(103,87,244,.24)}h1{font-size:24px;line-height:1.1;margin:0 0 4px}.subtitle{color:#a8bfdd;font-size:14px}.live{display:flex;align-items:center;gap:7px;color:#b6c8de;font-size:13px}.live-dot{width:9px;height:9px;border-radius:50%;background:#35e69a;box-shadow:0 0 12px rgba(53,230,154,.7)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#0b172a,#0c182b);border-radius:13px;padding:13px 17px;display:flex;align-items:center;gap:15px;min-height:88px;cursor:pointer;transition:.15s}.card:hover{border-color:var(--line2);transform:translateY(-1px)}.card.active{box-shadow:inset 0 0 0 1px #2e86ff;border-color:#3186f0}.card-icon{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:900}.card-icon.red{color:#ff8d9d;background:linear-gradient(145deg,#6b2438,#331626)}.card-icon.yellow{color:#ffd44f;background:linear-gradient(145deg,#5b4a12,#2d260d)}.card-icon.green{color:#43f0a5;background:linear-gradient(145deg,#14543b,#0e2d24)}.card-icon.blue{color:#63b9ff;background:linear-gradient(145deg,#0d4e9b,#0d2d61)}.card small{display:block;color:#b5c6dd;font-weight:700;font-size:13px}.card strong{font-size:31px;display:block;margin-top:3px}
.toolbar{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#0a1628;border-radius:13px;padding:8px}.searchbox{position:relative;flex:1;min-width:240px}.searchbox span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#a5b9d2}.searchbox input{width:100%;border:1px solid #264467;background:#0d1a2d;color:#fff;border-radius:10px;padding:11px 13px 11px 39px;outline:none}.searchbox input:focus{border-color:#3c86db}.tabs{display:flex;align-items:center;border:1px solid #264467;background:#0b1728;border-radius:10px;overflow:hidden}.tab{border:0;border-right:1px solid #223a58;background:transparent;color:#b8c8dc;padding:10px 18px;min-width:105px}.tab:last-child{border-right:0}.tab.active{background:linear-gradient(180deg,#1766c7,#124d9a);color:#fff;box-shadow:inset 0 0 0 1px #3e9aff}.total-label{margin-left:auto;padding:0 10px;color:#b6c8de;font-size:13px;white-space:nowrap}
.workspace{min-height:0;flex:1;display:grid;grid-template-columns:minmax(370px,37%) minmax(560px,63%);gap:12px}.list-panel,.detail-panel{min-height:0;border:1px solid var(--line);background:linear-gradient(180deg,#091526,#081322);border-radius:13px;overflow:hidden}.list-panel{display:flex;flex-direction:column}.claim-list{overflow:auto;min-height:0}.claim-row{padding:12px 16px;border-bottom:1px solid #172d49;display:grid;grid-template-columns:1fr auto;gap:7px 12px;cursor:pointer;transition:.12s}.claim-row:hover{background:#0d1d33}.claim-row.selected{background:linear-gradient(90deg,#12386a,#0b203b);box-shadow:inset 3px 0 #2e8cff}.claim-main{min-width:0}.claim-name{font-weight:850;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.claim-order{color:#8fb8ed;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.claim-subject{color:#9db3d0;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.claim-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.when{font-size:12px;color:#8fa6c3;white-space:nowrap}.badge{display:inline-flex;align-items:center;justify-content:center;border:1px solid;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;white-space:nowrap}.badge.open{color:#ff93a2;background:var(--redbg);border-color:#ff4f68}.badge.mediation{color:#ffd755;background:var(--yellowbg);border-color:#eab20e}.badge.closed{color:#59e9aa;background:var(--greenbg);border-color:#1bd687}.empty{padding:36px 20px;text-align:center;color:#91a7c2}.loading{padding:30px;text-align:center;color:#a9c2e0}
.detail-panel{display:flex;flex-direction:column}.detail-head{padding:14px 18px;border-bottom:1px solid #19314e;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.detail-title{font-size:21px;font-weight:900}.detail-order{margin-top:5px;color:#4aa1ff;font-size:14px}.detail-order a{color:inherit;text-decoration:none}.detail-order a:hover{text-decoration:underline}.detail-right{text-align:right}.detail-date{font-size:12px;color:#a0b4cf;margin-top:8px}.detail-scroll{overflow:auto;min-height:0;padding:10px 18px 16px}.product-line{display:flex;align-items:center;gap:13px;padding:2px 0 12px}.product-icon{width:56px;height:56px;border-radius:10px;border:1px solid #315073;background:linear-gradient(145deg,#eff6ff,#cfdbea);color:#17304f;display:grid;place-items:center;font-size:25px}.product-name{font-size:15px;font-weight:850}.product-sub{font-size:12px;color:#89a8cf;margin-top:4px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info-card{border:1px solid #234568;background:#0c1a2e;border-radius:11px;padding:13px}.info-title{font-weight:850;font-size:14px;display:flex;align-items:center;gap:8px}.info-card p{margin:8px 0 0;color:#b4c3d8;font-size:13px;line-height:1.45}.info-card .accent{color:#63abff}.history-title{font-size:14px;font-weight:900;margin:15px 0 8px}.messages{display:flex;flex-direction:column;gap:8px}.message{max-width:92%;border:1px solid #294d77;border-radius:11px;padding:10px 13px;background:#0e2340}.message.outbound{margin-left:auto;background:#172338;border-color:#2e435f}.message.mediator{background:#2f2812;border-color:#6d5a19}.msg-head{font-size:12px;font-weight:800;color:#d5e5f8;margin-bottom:5px;display:flex;gap:9px}.msg-date{font-weight:500;color:#8ea7c5}.msg-text{font-size:13px;line-height:1.42;color:#d4e2f3;white-space:pre-wrap}.no-messages{padding:18px;border:1px dashed #294765;border-radius:10px;color:#93a9c5;font-size:13px}
.composer{border-top:1px solid #1d3858;background:#091629;padding:12px 16px;display:flex;align-items:flex-end;gap:10px}.composer textarea{flex:1;min-height:48px;max-height:120px;resize:vertical;border:1px solid #294b70;background:#0d1b30;color:#fff;border-radius:10px;padding:13px;outline:none}.composer textarea:focus{border-color:#3a88df}.send{border:1px solid #786af7;background:linear-gradient(180deg,#6757e9,#4d40c4);color:white;border-radius:10px;padding:13px 22px;font-weight:850;min-height:48px}.send:disabled{opacity:.45;cursor:not-allowed}.composer-note{font-size:11px;color:#8fa5c0;margin-top:5px}.composer-wrap{flex:1}.errorbar{display:none;border:1px solid #7b2c3c;background:#3a1822;color:#ffb7c2;border-radius:10px;padding:10px 13px;font-size:13px}.errorbar.show{display:block}
@media(max-width:1100px){.workspace{grid-template-columns:42% 58%}.tab{min-width:auto;padding:10px 13px}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.page{padding:10px}.titlebar{align-items:flex-start}.workspace{display:block}.list-panel{height:390px;margin-bottom:10px}.detail-panel{min-height:620px}.toolbar{align-items:stretch;flex-direction:column}.tabs{overflow-x:auto}.tab{flex:1;white-space:nowrap}.total-label{margin:0}.info-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="page">
  <div class="titlebar">
    <div class="title-left">
      <div class="title-icon">R</div>
      <div><h1>Matrix AI · Central de Reclamações</h1><div class="subtitle">Mercado Livre → Matrix → Reclamações</div></div>
    </div>
    <div class="live"><span class="live-dot"></span><span id="liveText">Mercado Livre ao vivo</span></div>
  </div>

  <div class="cards">
    <div class="card" data-card-filter="open"><div class="card-icon red">!</div><div><small>Abertas</small><strong id="statOpen">0</strong></div></div>
    <div class="card" data-card-filter="mediation"><div class="card-icon yellow">◷</div><div><small>Em mediação</small><strong id="statMediation">0</strong></div></div>
    <div class="card" data-card-filter="closed"><div class="card-icon green">✓</div><div><small>Encerradas</small><strong id="statClosed">0</strong></div></div>
    <div class="card" data-card-filter="all"><div class="card-icon blue">▥</div><div><small>Total</small><strong id="statTotal">0</strong></div></div>
  </div>

  <div class="toolbar">
    <div class="searchbox"><span>⌕</span><input id="search" autocomplete="off" placeholder="Buscar por cliente, pedido ou reclamação..."></div>
    <div class="tabs">
      <button class="tab active" data-filter="all">Todas</button>
      <button class="tab" data-filter="open">Abertas</button>
      <button class="tab" data-filter="mediation">Em mediação</button>
      <button class="tab" data-filter="closed">Encerradas</button>
    </div>
    <div class="total-label" id="resultCount">0 reclamações</div>
  </div>

  <div class="errorbar" id="errorbar"></div>

  <div class="workspace">
    <section class="list-panel"><div class="claim-list" id="claimList"><div class="loading">Carregando reclamações do Mercado Livre...</div></div></section>
    <section class="detail-panel" id="detailPanel">
      <div class="empty">Selecione uma reclamação para ver todos os detalhes e o histórico.</div>
    </section>
  </div>
</div>

<script>
const state={rows:[],filter:'all',query:'',selected:null,detail:null,loadingDetail:false};
const fmtDate=new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'});
const fmtShort=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dateText(v,short=false){if(!v)return'-';const d=new Date(v);return Number.isFinite(d.getTime())?(short?fmtShort:fmtDate).format(d):'-'}
function categoryLabel(c){return c==='mediation'?'Em mediação':c==='closed'?'Encerrada':'Aberta'}
function badge(c){return `<span class="badge ${esc(c)}">${esc(categoryLabel(c))}</span>`}
function showError(msg){const e=document.getElementById('errorbar');if(!msg){e.className='errorbar';e.textContent='';return}e.textContent=msg;e.className='errorbar show'}
function visibleRows(){const q=state.query.trim().toLowerCase();return state.rows.filter(r=>(state.filter==='all'||r.category===state.filter)&&(!q||[r.claim_id,r.order_id,r.buyer_name,r.buyer_nickname,r.product_title,r.subject,r.reason_id].some(v=>String(v||'').toLowerCase().includes(q))))}
function setFilter(filter){state.filter=filter;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.cardFilter===filter));renderList()}
function renderStats(stats){statOpen.textContent=stats?.open||0;statMediation.textContent=stats?.mediation||0;statClosed.textContent=stats?.closed||0;statTotal.textContent=stats?.total||0}
function renderList(){const rows=visibleRows();resultCount.textContent=`${rows.length} ${rows.length===1?'reclamação':'reclamações'}`;if(!rows.length){claimList.innerHTML='<div class="empty">Nenhuma reclamação nesse filtro.</div>';return}claimList.innerHTML=rows.map(r=>`<div class="claim-row ${state.selected===String(r.claim_id)?'selected':''}" data-claim-id="${esc(r.claim_id)}"><div class="claim-main"><div class="claim-name">${esc(r.buyer_name||'Cliente Mercado Livre')}</div><div class="claim-order">${r.order_id?`Pedido #${esc(r.order_id)}`:`Reclamação #${esc(r.claim_id)}`}</div><div class="claim-subject" title="${esc(r.subject||r.product_title||'')}">${esc(r.subject||r.product_title||'Reclamação Mercado Livre')}</div></div><div class="claim-meta">${badge(r.category)}<div class="when">${esc(dateText(r.last_updated||r.date_created,true))}</div></div></div>`).join('')}
function messageRole(m){if(m.sender_role==='mediator')return'Mercado Livre';if(m.direction==='outbound')return'Matrix AI';return state.detail?.buyer_name||'Cliente'}
function renderDetail(){const d=state.detail;if(state.loadingDetail){detailPanel.innerHTML='<div class="loading">Atualizando reclamação diretamente no Mercado Livre...</div>';return}if(!d){detailPanel.innerHTML='<div class="empty">Selecione uma reclamação para ver todos os detalhes e o histórico.</div>';return}const actions=Array.isArray(d.available_actions)?d.available_actions:[];const canSend=d.category!=='closed'&&(actions.includes('send_message_to_mediator')||actions.includes('send_message_to_complainant'));const productSub=[d.seller_sku?`SKU: ${d.seller_sku}`:'',d.product_quantity?`Qtd.: ${d.product_quantity}`:''].filter(Boolean).join(' · ');const problem=d.problem||d.description||d.subject||'Motivo não informado pelo Mercado Livre.';const lastMessage=(d.messages||[]).slice(-1)[0];detailPanel.innerHTML=`<div class="detail-head"><div><div class="detail-title">${esc(d.buyer_name||'Cliente Mercado Livre')}</div><div class="detail-order">${d.order_id?(d.order_url?`<a href="${esc(d.order_url)}" target="_blank" rel="noopener">Pedido #${esc(d.order_id)} ↗</a>`:`Pedido #${esc(d.order_id)}`):`Reclamação #${esc(d.claim_id)}`}</div></div><div class="detail-right">${badge(d.category)}<div class="detail-date">${esc(dateText(d.last_updated||d.date_created))}</div></div></div><div class="detail-scroll"><div class="product-line"><div class="product-icon">▣</div><div><div class="product-name">${esc(d.product_title||'Produto Mercado Livre')}</div><div class="product-sub">${esc(productSub||`Claim #${d.claim_id}`)}</div></div></div><div class="info-grid"><div class="info-card"><div class="info-title"><span class="accent">▤</span> Motivo da reclamação</div><p>${esc(problem)}</p></div><div class="info-card"><div class="info-title"><span class="accent">◷</span> Última atualização</div><p>${esc(dateText(d.last_updated||d.date_created))}<br>${d.stage==='dispute'?'<strong style="color:#ffd755">Mediação do Mercado Livre</strong>':d.category==='closed'?'<strong style="color:#59e9aa">Reclamação encerrada</strong>':'Reclamação aberta'}${lastMessage?`<br><span style="color:#91acd0">Última mensagem: ${esc(String(lastMessage.text||'').slice(0,150))}</span>`:''}</p></div></div><div class="history-title">Histórico da reclamação</div><div class="messages">${(d.messages||[]).length?(d.messages||[]).map(m=>`<div class="message ${m.sender_role==='mediator'?'mediator':m.direction==='outbound'?'outbound':''}"><div class="msg-head"><span>${esc(messageRole(m))}</span><span class="msg-date">${esc(dateText(m.date_created))}</span></div><div class="msg-text">${esc(m.text||'')}</div></div>`).join(''):'<div class="no-messages">O Mercado Livre não retornou mensagens para esta reclamação.</div>'}</div></div><div class="composer"><div class="composer-wrap"><textarea id="replyText" maxlength="5000" placeholder="${canSend?'Digite sua resposta...':d.category==='closed'?'Reclamação encerrada — envio desabilitado.':'O Mercado Livre não liberou envio de mensagem neste momento.'}" ${canSend?'':'disabled'}></textarea><div class="composer-note">${d.category==='mediation'?'Na mediação, a resposta é enviada ao mediador do Mercado Livre.':'A resposta segue o canal oficial da reclamação no Mercado Livre.'}</div></div><button class="send" id="sendBtn" ${canSend?'':'disabled'}>Enviar</button></div>`;if(canSend)document.getElementById('sendBtn').addEventListener('click',sendReply)}
async function loadClaims(force=false){showError('');liveText.textContent='Atualizando Mercado Livre...';try{const r=await fetch(`/api/reclamacoes/ml${force?'?refresh=1':''}`,{cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.sucesso)throw new Error(j.mensagem||'Não foi possível carregar as reclamações.');state.rows=j.reclamacoes||[];renderStats(j.stats||{});renderList();liveText.textContent=j.truncado?`${state.rows.length} de ${j.total_mercado_livre} reclamações`:'Mercado Livre ao vivo';if(!state.selected&&state.rows.length)selectClaim(state.rows[0].claim_id)}catch(e){claimList.innerHTML='<div class="empty">Falha ao carregar reclamações.</div>';showError(e.message);liveText.textContent='Falha na atualização'}}
async function selectClaim(id){id=String(id);state.selected=id;state.loadingDetail=true;state.detail=null;renderList();renderDetail();showError('');try{const r=await fetch(`/api/reclamacoes/ml/${encodeURIComponent(id)}`,{cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||!j.sucesso)throw new Error(j.mensagem||'Não foi possível abrir a reclamação.');state.detail=j.reclamacao;const row=state.rows.find(x=>String(x.claim_id)===id);if(row&&state.detail){row.buyer_name=state.detail.buyer_name||row.buyer_name;row.product_title=state.detail.product_title||row.product_title;row.subject=state.detail.subject||row.subject;row.category=state.detail.category||row.category;row.last_updated=state.detail.last_updated||row.last_updated}renderList()}catch(e){showError(e.message)}finally{state.loadingDetail=false;renderDetail()}}
async function sendReply(){const btn=document.getElementById('sendBtn'),text=document.getElementById('replyText')?.value.trim();if(!text)return;btn.disabled=true;btn.textContent='Enviando...';showError('');try{const r=await fetch(`/api/reclamacoes/ml/${encodeURIComponent(state.selected)}/send`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.sucesso)throw new Error(j.mensagem||'Falha ao enviar resposta.');state.detail=j.reclamacao;renderDetail();await loadClaims(true)}catch(e){showError(e.message);btn.disabled=false;btn.textContent='Enviar'}}
claimList.addEventListener('click',e=>{const row=e.target.closest('[data-claim-id]');if(row)selectClaim(row.dataset.claimId)});
search.addEventListener('input',e=>{state.query=e.target.value;renderList()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>setFilter(c.dataset.cardFilter)));
loadClaims(false);
</script>
<script defer src="/reclamacoes-ai.js?v=1"></script>
</body>
</html>
