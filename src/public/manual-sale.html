<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix AI · Nova Venda Manual</title><link rel="stylesheet" href="/matrix-global-nav.css?v=4"><style>
:root{color-scheme:dark;--bg:#06101d;--panel:#0d1a2d;--line:#2b476d;--text:#f4f7ff;--muted:#91a7c5;--blue:#3789ff;--green:#2de09a;--purple:#8c5df5;--red:#ff6278}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#0b2342,#07111f 38%,#050d18);color:var(--text);font:14px/1.4 Inter,Segoe UI,Arial,sans-serif}.page{padding:22px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.hero h1{margin:0;font-size:28px}.hero p{color:var(--muted);margin:4px 0}.btn{border:1px solid #34557d;background:#13243e;color:white;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.primary{background:#1c68d7;border-color:#4592ff}.btn.good{background:#157b57;border-color:#2ed39a}.btn.purple{background:#6647cf;border-color:#9171ff}.btn.danger{background:#5b1d2b;border-color:#a53b50}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:14px}.card{border:1px solid var(--line);background:rgba(10,23,41,.97);border-radius:14px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid #1d3555;font-weight:900}.body{padding:15px}.field{margin-bottom:11px}.field label{display:block;color:#afc0d8;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#071524;color:#fff;border:1px solid #315078;border-radius:9px;padding:10px}.field textarea{min-height:72px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search-results{max-height:240px;overflow:auto;border:1px solid #294765;border-radius:10px;margin-top:7px;display:none}.search-results.show{display:block}.result{padding:10px;border-bottom:1px solid #1d3452;cursor:pointer}.result:hover{background:#102640}.result small{display:block;color:var(--muted)}.items{display:flex;flex-direction:column;gap:8px}.item{display:grid;grid-template-columns:minmax(240px,1fr) 90px 130px 110px 42px;gap:8px;align-items:center;background:#091728;border:1px solid #213d61;border-radius:10px;padding:9px}.item input{width:100%;background:#061321;border:1px solid #315078;color:#fff;border-radius:8px;padding:8px}.remove{border:1px solid #753647;background:#351620;color:#ffb6c1;border-radius:8px;height:36px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{border:1px solid #29476d;background:#091728;border-radius:10px;padding:11px}.metric small{color:#93aaca}.metric strong{display:block;font-size:20px;margin-top:5px}.metric.profit strong{color:#82efc4}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.status{display:none;margin-top:12px;padding:11px;border-radius:9px}.status.show{display:block}.status.ok{background:#0c3027;border:1px solid #1f805d;color:#9ff2d2}.status.err{background:#35151d;border:1px solid #8b3544;color:#ffc0c9}.optional{color:#7f9abb;font-weight:500}.saved{border:1px solid #1e805c;background:#0d3025;padding:12px;border-radius:10px;margin-top:12px;display:none}.saved.show{display:block}@media(max-width:900px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 70px 110px 90px 38px}}@media(max-width:600px){.page{padding:12px}.row{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item .remove{grid-column:2}.summary{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="page"><div class="hero"><div><h1>Nova venda manual</h1><p>Venda rápida de balcão ou venda identificada. Cliente é opcional até a emissão da NF-e.</p></div><button class="btn" onclick="location.href='/erp'">← Voltar para Vendas</button></div><div class="grid"><section class="card"><div class="head">Produtos / kits</div><div class="body"><div class="field"><label>Buscar produto, kit, referência ou MLB</label><input id="productSearch" autocomplete="off" placeholder="Ex.: i5 3470, MLB..., SSD 120GB"><div id="searchResults" class="search-results"></div></div><div id="items" class="items"></div></div></section><aside><section class="card"><div class="head">Cliente <span class="optional">(opcional)</span></div><div class="body"><div class="field"><label>Nome</label><input id="customerName" placeholder="Pode deixar em branco"></div><div class="row"><div class="field"><label>CPF/CNPJ</label><input id="customerDocument"></div><div class="field"><label>Telefone</label><input id="customerPhone"></div></div><div class="field"><label>E-mail</label><input id="customerEmail"></div><details><summary>Endereço para NF-e</summary><div class="row" style="margin-top:10px"><div class="field"><label>Rua</label><input id="addressLine"></div><div class="field"><label>Número</label><input id="addressNumber"></div><div class="field"><label>Bairro</label><input id="neighborhood"></div><div class="field"><label>CEP</label><input id="zipCode"></div><div class="field"><label>Cidade</label><input id="city"></div><div class="field"><label>UF</label><input id="state" maxlength="2"></div></div></details></div></section><section class="card" style="margin-top:14px"><div class="head">Fechamento</div><div class="body"><div class="row"><div class="field"><label>Desconto (R$)</label><input id="discount" value="0" inputmode="decimal"></div><div class="field"><label>Pagamento</label><select id="payment"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option><option>Outro</option></select></div></div><div class="field"><label>Observação</label><textarea id="notes"></textarea></div><div class="summary"><div class="metric"><small>Total</small><strong id="gross">R$ 0,00</strong></div><div class="metric"><small>Líquido</small><strong id="net">R$ 0,00</strong></div><div class="metric"><small>Custo real</small><strong id="cost">R$ 0,00</strong></div><div class="metric profit"><small>Lucro estimado</small><strong id="profit">R$ 0,00</strong></div></div><div class="actions"><button id="saveBtn" class="btn good">SALVAR VENDA</button><button id="saveNfeBtn" class="btn purple">SALVAR + EMITIR NF-e</button></div><div id="status" class="status"></div><div id="saved" class="saved"></div></div></section></aside></div></main><script>
(()=>{const $=id=>document.getElementById(id),brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let products=[],selected=[],savedSale=null;const parse=v=>{const s=String(v||'0').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))return Number(s.replace(/\./g,'').replace(',','.'))||0;if(s.includes(','))return Number(s.replace(',','.'))||0;return Number(s)||0};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opts={}){const r=await fetch(url,{...opts,cache:'no-store',headers:{'Content-Type':'application/json',...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok||d.sucesso===false)throw new Error(d.mensagem||`HTTP ${r.status}`);return d}function show(type,msg){const e=$('status');e.className=`status show ${type}`;e.textContent=msg}function actualCost(p){return Number(p.actual_cost??p.average_cost??0)}function calc(){let gross=0,cost=0;selected.forEach(x=>{gross+=parse(x.price)*parse(x.qty);cost+=actualCost(x.product)*parse(x.qty)});const net=Math.max(0,gross-parse($('discount').value));$('gross').textContent=brl(gross);$('net').textContent=brl(net);$('cost').textContent=brl(cost);$('profit').textContent=brl(net-cost)}function render(){const box=$('items');box.innerHTML=selected.length?selected.map((x,i)=>`<div class="item" data-i="${i}"><div><strong>${esc(x.product.name)}</strong><small style="display:block;color:#8fa4c3">${esc(x.product.sku||'')} · ${x.product.product_type==='kit'?'Kit virtual':'Peça/produto'} · custo ${brl(actualCost(x.product))}</small></div><input class="qty" value="${x.qty}" inputmode="decimal" title="Quantidade"><input class="price" value="${x.price}" inputmode="decimal" title="Preço unitário"><div class="line">${brl(parse(x.qty)*parse(x.price))}</div><button class="remove" type="button">×</button></div>`).join(''):'<div style="color:#8fa4c3;padding:16px;text-align:center">Adicione o primeiro produto acima.</div>';box.querySelectorAll('.item').forEach(row=>{const i=Number(row.dataset.i);row.querySelector('.qty').oninput=e=>{selected[i].qty=e.target.value;render();calc()};row.querySelector('.price').oninput=e=>{selected[i].price=e.target.value;render();calc()};row.querySelector('.remove').onclick=()=>{selected.splice(i,1);render();calc()}});calc()}function search(){const q=$('productSearch').value.trim().toLowerCase(),box=$('searchResults');if(!q){box.classList.remove('show');return}const rows=products.filter(p=>p.active!==false&&String([p.sku,p.name,p.category].join(' ')).toLowerCase().includes(q)).slice(0,25);box.innerHTML=rows.map(p=>`<div class="result" data-id="${p.product_id}"><strong>${esc(p.name)}</strong><small>${esc(p.sku||'')} · ${p.product_type==='kit'?'Kit':'Item'} · disp. ${Number(p.available||0).toLocaleString('pt-BR')} · custo ${brl(actualCost(p))}</small></div>`).join('');box.classList.add('show');box.querySelectorAll('.result').forEach(r=>r.onclick=()=>{const p=products.find(x=>Number(x.product_id)===Number(r.dataset.id));selected.push({product:p,qty:1,price:0});$('productSearch').value='';box.classList.remove('show');render()})}function payload(){return{customer_name:$('customerName').value.trim()||null,customer_document:$('customerDocument').value.trim()||null,customer_phone:$('customerPhone').value.trim()||null,customer_email:$('customerEmail').value.trim()||null,customer_address:{address_line:$('addressLine').value.trim()||null,address_number:$('addressNumber').value.trim()||null,neighborhood:$('neighborhood').value.trim()||null,zip_code:$('zipCode').value.trim()||null,city:$('city').value.trim()||null,state:$('state').value.trim().toUpperCase()||null},discount_amount:parse($('discount').value),payment_method:$('payment').value,notes:$('notes').value.trim()||null,items:selected.map(x=>({product_id:Number(x.product.product_id),quantity:parse(x.qty),unit_price:parse(x.price)}))}}async function save(emit){const btn=emit?$('saveNfeBtn'):$('saveBtn');btn.disabled=true;try{if(!selected.length)throw new Error('Adicione pelo menos um produto.');if(selected.some(x=>parse(x.qty)<=0||parse(x.price)<0))throw new Error('Confira quantidade e preço.');show('ok','Gravando venda e baixando estoque...');const d=await api('/sales/manual',{method:'POST',body:JSON.stringify(payload())});savedSale=d.venda;$('saved').className='saved show';$('saved').innerHTML=`Venda manual <strong>#${savedSale.sale_number}</strong> salva. Estoque: ${savedSale.stock_status}. Lucro: <strong>${brl(savedSale.total_profit)}</strong>.`;show('ok','Venda salva com sucesso.');if(emit)await emitNfe()}catch(e){show('err',e.message)}finally{btn.disabled=false}}async function emitNfe(){if(!savedSale)return;try{if(!$('customerDocument').value.trim())throw new Error('Para emitir NF-e, informe CPF/CNPJ. A venda pode continuar salva sem cliente.');show('ok','Enviando NF-e ao Bling/SEFAZ...');const d=await api(`/sales/manual/${savedSale.id}/nfe/emit`,{method:'POST',body:JSON.stringify(payload())});savedSale=d.venda;show('ok',d.mensagem||'NF-e enviada.');$('saved').innerHTML+=`<br>NF-e: <strong>${esc(savedSale.nfe_number||savedSale.nfe_status||'enviada')}</strong>`}catch(e){show('err',`Venda salva, mas a NF-e não foi emitida: ${e.message}`)}}$('saveBtn').onclick=()=>save(false);$('saveNfeBtn').onclick=()=>save(true);$('discount').oninput=calc;$('productSearch').oninput=search;api('/stock/products').then(d=>{products=d.produtos||[]}).catch(e=>show('err',e.message));render()})();
</script><script defer src="/matrix-global-nav.js?v=8"></script></body></html>
