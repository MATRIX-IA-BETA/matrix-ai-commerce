<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix AI | Central Fiscal NF-e</title><style>
:root{--bg:#0b1020;--panel:#121a2f;--line:#263453;--text:#edf3ff;--muted:#92a3c1;--ok:#2fd080;--warn:#f4bf50;--bad:#ff6577;--blue:#5aa7ff}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1c,#0d1425);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1600px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand h1{font-size:25px;margin:0 0 4px}.brand p{margin:0;color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.btn{border:1px solid var(--line);background:#18233f;color:var(--text);text-decoration:none;padding:10px 13px;border-radius:10px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}.card .n{font-size:30px;font-weight:800;margin-top:6px}.card small{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;flex-wrap:wrap}.search{flex:1;min-width:250px;background:#0d1528;border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{padding:9px 12px;border:1px solid var(--line);background:#10192d;color:var(--muted);border-radius:10px;cursor:pointer}.tab.active{color:white;background:#203050}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:1390px}th,td{padding:12px 10px;border-bottom:1px solid #202c48;text-align:left;vertical-align:middle}th{font-size:12px;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:#111a2f;z-index:2}td{font-size:14px}.order{font-weight:800}.product{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.money{font-weight:700}.discount{display:flex;gap:6px}.discount select,.discount input{background:#0d1528;color:white;border:1px solid var(--line);border-radius:8px;padding:8px}.discount select{width:67px}.discount input{width:94px}.final{font-size:16px;font-weight:900}.status{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#26324d}.status.processing{color:#ffd77d;background:#3b311c}.status.authorized{color:#8ff0bd;background:#153626}.status.error{color:#ff9cab;background:#451d29}.emit{white-space:nowrap;background:#1f6feb;border:1px solid #438fff;color:white;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.emit[disabled]{opacity:.5}.mini{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#18233f;color:white;cursor:pointer;text-decoration:none;display:inline-block;margin:2px}.mini[disabled]{opacity:.34;cursor:not-allowed}.documents{display:flex;gap:5px;align-items:center;white-space:nowrap}.docbtn{font-weight:800;min-width:58px}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;max-width:430px;background:#121a2f;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 18px 60px #0008;display:none;z-index:10}.toast.show{display:block}.toast.bad{border-color:#7d2737}.summary{font-size:12px;color:var(--muted);margin-left:auto}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.wrap{padding:12px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>Matrix AI · Central Fiscal NF-e</h1><p>Mercado Livre → Matrix → Bling → SEFAZ</p></div><div class="nav"><a href="/sac/central">SAC</a><a href="/sac/perguntas">Perguntas ML</a><a href="/mercadolivre-painel.html">Mercado Livre</a><button class="btn" id="refreshBtn">Atualizar</button></div></div>
<div class="cards"><div class="card" data-filter="pending"><small>A emitir</small><div class="n" id="kPending">0</div></div><div class="card" data-filter="processing"><small>Processando</small><div class="n" id="kProcessing">0</div></div><div class="card" data-filter="authorized"><small>Autorizadas</small><div class="n" id="kAuthorized">0</div></div><div class="card" data-filter="error"><small>Com erro</small><div class="n" id="kError">0</div></div></div>
<div class="toolbar"><input id="search" class="search" placeholder="Buscar pedido, cliente ou produto..."><div class="tabs"><button class="tab active" data-filter="all">Todos</button><button class="tab" data-filter="pending">A emitir</button><button class="tab" data-filter="processing">Processando</button><button class="tab" data-filter="authorized">Autorizadas</button><button class="tab" data-filter="error">Erros</button></div><span class="summary" id="summary"></span></div>
<div class="tablebox"><table><thead><tr><th>Pedido</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Qtd.</th><th>Valor ML</th><th>Desconto interno</th><th>Valor NF-e</th><th>Status</th><th>Documentos</th><th>Ação</th></tr></thead><tbody id="tbody"><tr><td colspan="11" class="empty">Carregando pedidos...</td></tr></tbody></table></div></div><div class="toast" id="toast"></div>
<script>
const state={rows:[],filter:'all',query:''},money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),dateFmt=new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'});function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function category(r){const s=String(r.fiscal?.status||'').toLowerCase();if(s==='authorized'||s.includes('autoriz'))return'authorized';if(s.includes('error')||s.includes('rejeit')||s.includes('deneg'))return'error';if(['created_bling','sending','sent_to_sefaz','sent_to_bling','processing'].includes(s))return'processing';return'pending'}function statusLabel(r){const c=category(r),s=r.fiscal?.status;if(c==='authorized')return'Autorizada';if(c==='error')return s==='send_error'?'Erro no envio':'Com erro';if(c==='processing')return s==='created_bling'?'Criada no Bling':'Processando';return'A emitir'}function calc(r){const t=r._discountType||r.suggested_discount_type||'percent',v=Number(r._discountValue??r.suggested_discount_value??0),g=Number(r.gross_amount||0);return Math.max(0,t==='value'?g-v:g*(1-Math.min(100,v)/100))}function toast(msg,type='ok'){const e=document.getElementById('toast');e.textContent=msg;e.className='toast show '+type;clearTimeout(window.__t);window.__t=setTimeout(()=>e.className='toast',4500)}
async function downloadFiscalDocument(key,format){const f=String(format||'').toLowerCase();if(!/^\d{44}$/.test(String(key||'')))throw new Error('Documento ainda não disponível: chave de acesso da NF-e não sincronizada.');if(!['pdf','xml'].includes(f))throw new Error('Formato de documento inválido.');const response=await fetch(`/bling/nfe/document/${encodeURIComponent(key)}/${f}`,{cache:'no-store'});if(!response.ok){let message='Não foi possível baixar o documento no Bling.';try{const j=await response.json();message=j.mensagem||message}catch(_){}throw new Error(message)}const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`NFe-${key}.${f}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function load(){const b=document.getElementById('refreshBtn');b.disabled=true;try{const r=await fetch('/fiscal/queue?limit=300',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.sucesso)throw new Error(j.mensagem||'Erro ao carregar fila fiscal');state.rows=j.pedidos||[];for(const x of state.rows){x._discountType=x.fiscal?.status==='preview'?(x.fiscal.discount_type||'percent'):(x.suggested_discount_type||'percent');x._discountValue=Number(x.fiscal?.status==='preview'?(x.fiscal.discount_value??0):(x.suggested_discount_value||0))}render()}catch(e){document.getElementById('tbody').innerHTML=`<tr><td colspan="11" class="empty">${esc(e.message)}</td></tr>`;toast(e.message,'bad')}finally{b.disabled=false}}
function render(){const counts={pending:0,processing:0,authorized:0,error:0};state.rows.forEach(r=>counts[category(r)]++);kPending.textContent=counts.pending;kProcessing.textContent=counts.processing;kAuthorized.textContent=counts.authorized;kError.textContent=counts.error;const q=state.query.trim().toLowerCase(),rows=state.rows.filter(r=>(state.filter==='all'||category(r)===state.filter)&&(!q||[r.marketplace_order_id,r.buyer_name,r.product_title].some(v=>String(v||'').toLowerCase().includes(q))));summary.textContent=`${rows.length} de ${state.rows.length} pedidos`;if(!rows.length){tbody.innerHTML='<tr><td colspan="11" class="empty">Nenhum pedido nesse filtro.</td></tr>';return}tbody.innerHTML=rows.map(r=>{const c=category(r),final=calc(r),key=String(r.fiscal?.nfe_access_key||''),id=r.fiscal?.bling_nfe_id,disabled=c==='authorized'||c==='processing',docReady=/^\d{44}$/.test(key);let a='';if(c==='pending'||c==='error')a=`<button class="emit" data-action="emit" data-id="${esc(r.marketplace_order_id)}">EMITIR NF-e</button>`;if(c==='processing'&&id)a=`<button class="mini" data-action="refresh-nfe" data-id="${esc(id)}">Atualizar NF-e</button>`;if(c==='authorized'&&!docReady&&id)a=`<button class="mini" data-action="refresh-nfe" data-id="${esc(id)}">Atualizar</button>`;if(c==='authorized'&&docReady)a='<span style="color:var(--muted)">—</span>';const docs=`<div class="documents"><button class="mini docbtn" data-action="download-doc" data-key="${esc(key)}" data-format="pdf" ${docReady?'':'disabled'} title="${docReady?'Baixar DANFE em PDF':'Disponível após a chave da NF-e ser sincronizada'}">DANFE</button><button class="mini docbtn" data-action="download-doc" data-key="${esc(key)}" data-format="xml" ${docReady?'':'disabled'} title="${docReady?'Baixar XML da NF-e':'Disponível após a chave da NF-e ser sincronizada'}">XML</button></div>`;return `<tr><td class="order">${esc(r.marketplace_order_id)}</td><td>${r.date_created?esc(dateFmt.format(new Date(r.date_created))):'-'}</td><td>${esc(r.buyer_name)}</td><td class="product" title="${esc(r.product_title)}">${esc(r.product_title)}</td><td>${esc(r.quantity)}</td><td class="money">${money.format(Number(r.gross_amount||0))}</td><td><div class="discount"><select data-role="dtype" data-id="${esc(r.marketplace_order_id)}" ${disabled?'disabled':''}><option value="value" ${r._discountType==='value'?'selected':''}>R$</option><option value="percent" ${r._discountType==='percent'?'selected':''}>%</option></select><input data-role="dvalue" data-id="${esc(r.marketplace_order_id)}" type="number" min="0" step="0.01" value="${esc(r._discountValue)}" ${disabled?'disabled':''}></div></td><td class="final" id="final-${esc(r.marketplace_order_id)}">${money.format(final)}</td><td><span class="status ${c}">${esc(statusLabel(r))}</span></td><td>${docs}</td><td>${a}</td></tr>`}).join('')}
document.addEventListener('input',e=>{if(e.target.dataset.role!=='dvalue')return;const id=e.target.dataset.id,r=state.rows.find(x=>String(x.marketplace_order_id)===String(id));if(!r)return;r._discountValue=Math.max(0,Number(e.target.value||0));const f=document.getElementById('final-'+id);if(f)f.textContent=money.format(calc(r))});document.addEventListener('change',e=>{if(e.target.dataset.role!=='dtype')return;const id=e.target.dataset.id,r=state.rows.find(x=>String(x.marketplace_order_id)===String(id));if(!r)return;r._discountType=e.target.value;const f=document.getElementById('final-'+id);if(f)f.textContent=money.format(calc(r))});document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;if(action==='download-doc'){const original=b.textContent;b.disabled=true;b.textContent='...';try{await downloadFiscalDocument(b.dataset.key,b.dataset.format);toast(`${String(b.dataset.format).toUpperCase()} baixado.`)}catch(err){toast(err.message,'bad')}finally{b.disabled=false;b.textContent=original}}if(action==='emit'){const r=state.rows.find(x=>String(x.marketplace_order_id)===String(id));b.disabled=true;b.textContent='EMITINDO...';try{const rr=await fetch(`/bling/nfe/emit/from-order/${encodeURIComponent(id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({discount_type:r._discountType,discount_value:Number(r._discountValue||0)})}),j=await rr.json();if(!rr.ok||!j.sucesso)throw new Error(j.mensagem||'Falha na emissão');toast(j.mensagem||'NF-e enviada.');await load()}catch(err){toast(err.message,'bad');b.disabled=false;b.textContent='EMITIR NF-e'}}if(action==='refresh-nfe'){b.disabled=true;try{const rr=await fetch(`/bling/nfe/${encodeURIComponent(id)}/refresh`,{method:'POST'}),j=await rr.json();if(!rr.ok||!j.sucesso)throw new Error(j.mensagem||'Falha ao atualizar');toast('Situação atualizada.');await load()}catch(err){toast(err.message,'bad');b.disabled=false}}});search.addEventListener('input',e=>{state.query=e.target.value;render()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;render()}));document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{state.filter=c.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===state.filter));render()}));refreshBtn.addEventListener('click',load);load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
